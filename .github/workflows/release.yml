name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'gomeen/Zakki'
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      previous-version: ${{ steps.previous-release.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 解析增量更新基线
        id: previous-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Latest Release 不是正式版本: $tag" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: 校验版本与更新私钥配置
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          PREVIOUS_VERSION: ${{ steps.previous-release.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '只允许规范的 vX.Y.Z 正式版本；测试包不要使用正式更新渠道。' >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r new_major new_minor new_patch <<< "$version"
          IFS=. read -r old_major old_minor old_patch <<< "$PREVIOUS_VERSION"
          if ! (( new_major > old_major ||
                  new_major == old_major && new_minor > old_minor ||
                  new_major == old_major && new_minor == old_minor && new_patch > old_patch )); then
            echo "新版本 $version 必须严格高于当前 Latest $PREVIOUS_VERSION。" >&2
            exit 1
          fi
          jq -e --arg tag "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" '
            .name == "Zakki" and
            .updates.github == $repo and
            .updates.tagPrefix == "v" and
            (.updates.tagPrefix + .version) == $tag and
            (.updates.publicKey | length > 0)
          ' mygo.json > /dev/null
          if [[ -z "$MYGO_UPDATER_PRIVATE_KEY" ]]; then
            echo '请先配置 MYGO_UPDATER_PRIVATE_KEY Secret；缺私钥时禁止发布。' >&2
            exit 1
          fi

      - name: 全量检查
        env:
          # 与 ci.yml 同理：runner 系统语言是英文，不钉扎会让中文文案断言失真。
          MYGO_LOCALE: zh-Hans
        run: |
          set -euo pipefail
          # 与 ci.yml 的 go mod verify 步骤同源：只豁免本地目录替换模块 zakki/core 的
          # 已知 missing ziphash 误报（Go 1.27 回归），其余校验失败照常报错。
          known='^zakki/core v0\.0\.0-00010101[0-9]*-000000000000: missing ziphash:'
          out="$(go mod verify 2>&1)" && status=0 || status=$?
          if [ "$status" -ne 0 ]; then
            rest="$(printf '%s\n' "$out" | grep -Ev "$known" || true)"
            if [ -n "$rest" ]; then
              printf '%s\n' "$out" >&2
              exit 1
            fi
            echo 'go mod verify: 豁免本地目录替换模块 zakki/core 的已知误报'
          fi
          printf '%s\n' "$out"
          go -C core mod verify
          make check

  build:
    needs: check
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            target: darwin-universal
          - os: ubuntu-latest
            platform: windows/amd64
            target: windows-amd64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 安装 Windows 安装器编译依赖
        if: matrix.target == 'windows-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          makensis -VERSION

      - name: 构建安装包与签名更新包
        env:
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MYGO_UPDATER_PRIVATE_KEY"
          go tool mygo build -platform "$PLATFORM"

      - name: 核查产物
        env:
          TARGET: ${{ matrix.target }}
          PREVIOUS_VERSION: ${{ needs.check.outputs.previous-version }}
        run: |
          set -euo pipefail
          version="$(jq -r .version mygo.json)"
          cd "build/$TARGET"
          archive="zakki-$version-$TARGET.tar.gz"
          manifest="update-$TARGET.json"
          delta="zakki-$PREVIOUS_VERSION-to-$version-$TARGET.delta"
          test "$PREVIOUS_VERSION" != "$version"
          case "$TARGET" in
            darwin-universal)
              installer="zakki-$version.dmg"
              lipo Zakki.app/Contents/MacOS/Zakki -verify_arch x86_64 arm64
              codesign --verify --deep --strict Zakki.app
              ;;
            windows-amd64)
              installer="zakki-setup-$version-amd64.exe"
              test -s Zakki.exe
              file Zakki.exe | grep -Eq 'PE32\+.*x86-64'
              ;;
            *) echo "未知发布目标: $TARGET" >&2; exit 1 ;;
          esac
          test -s "$installer"
          test -s "$archive"
          jq -e --arg version "$version" --arg archive "$archive" '
            .version == $version and
            .url == ("https://github.com/gomeen/Zakki/releases/download/v" + $version + "/" + $archive) and
            (.signature | length > 0) and .size > 0
          ' "$manifest" > /dev/null
          test "$(wc -c < "$archive" | tr -d ' ')" = "$(jq -r .size "$manifest")"
          jq -e --arg previous "$PREVIOUS_VERSION" --arg delta "$delta" '
            [.deltas[]? | select(
              .from == $previous and
              (.url | endswith("/" + $delta)) and
              (.signature | length > 0) and .size > 0
            )] | length == 1
          ' "$manifest" > /dev/null
          test -s "$delta"
          test "$(wc -c < "$delta" | tr -d ' ')" = "$(
            jq -r --arg previous "$PREVIOUS_VERSION" --arg delta "$delta" '
              .deltas[] | select(.from == $previous and (.url | endswith("/" + $delta))) | .size
            ' "$manifest"
          )"

      - name: 保留平台构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Zakki-${{ github.ref_name }}-${{ matrix.target }}
          if-no-files-found: error
          path: |
            build/${{ matrix.target }}/*.dmg
            build/${{ matrix.target }}/zakki-setup-*.exe
            build/${{ matrix.target }}/*.tar.gz
            build/${{ matrix.target }}/*.json
            build/${{ matrix.target }}/*.delta

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: 汇总两个平台的产物
        uses: actions/download-artifact@v4
        with:
          pattern: Zakki-${{ github.ref_name }}-*
          merge-multiple: true
          path: release-artifacts

      - name: 核查两个平台的发行文件
        working-directory: release-artifacts
        env:
          PREVIOUS_VERSION: ${{ needs.check.outputs.previous-version }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$PREVIOUS_VERSION" != "$version"
          test -s "zakki-$version.dmg"
          test -s "zakki-setup-$version-amd64.exe"
          for target in darwin-universal windows-amd64; do
            archive="zakki-$version-$target.tar.gz"
            manifest="update-$target.json"
            delta="zakki-$PREVIOUS_VERSION-to-$version-$target.delta"
            test -s "$archive"
            jq -e --arg version "$version" --arg archive "$archive" \
              --arg previous "$PREVIOUS_VERSION" --arg delta "$delta" '
              .version == $version and
              .url == ("https://github.com/gomeen/Zakki/releases/download/v" + $version + "/" + $archive) and
              (.signature | length > 0) and .size > 0 and
              ([.deltas[]? | select(
                .from == $previous and
                (.url | endswith("/" + $delta)) and
                (.signature | length > 0) and .size > 0
              )] | length == 1)
            ' "$manifest" > /dev/null
            test "$(wc -c < "$archive" | tr -d ' ')" = "$(jq -r .size "$manifest")"
            test -s "$delta"
            test "$(wc -c < "$delta" | tr -d ' ')" = "$(
              jq -r --arg previous "$PREVIOUS_VERSION" --arg delta "$delta" '
                .deltas[] | select(.from == $previous and (.url | endswith("/" + $delta))) | .size
              ' "$manifest"
            )"
          done

      - name: 上传到草稿 Release（不覆盖已公开版本）
        working-directory: release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$repo" --json isDraft > "$RUNNER_TEMP/zakki-release.json"; then
            if ! jq -e '.isDraft == true' "$RUNNER_TEMP/zakki-release.json" > /dev/null; then
              echo '拒绝覆盖已公开版本；请递增版本号后发布。' >&2
              exit 1
            fi
          else
            gh release create "$tag" --repo "$repo" --verify-tag --draft \
              --title "Zakki $tag" --generate-notes
          fi
          shopt -s nullglob
          files=(*.dmg zakki-setup-*.exe *.tar.gz *.delta)
          gh release upload "$tag" --repo "$repo" --clobber "${files[@]}"
          # 两个平台的安装包与归档均上传后，才上传更新清单。
          gh release upload "$tag" --repo "$repo" --clobber \
            update-darwin-universal.json update-windows-amd64.json
          echo "::notice::两个平台已上传到草稿 ${tag}；验证后手动 Publish release 并设为 Latest。"
