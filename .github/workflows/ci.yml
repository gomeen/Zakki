# Zakki CI。
# 全量测试为准，不做测试排除。
# runner 用 macos-latest：MyGo 是原生 UI 工具链，README 的开发命令都按 macOS 写。
name: ci

on:
  # 移动端改动走 mobile.yml；paths 与 paths-ignore 不能混用于同一触发器，桌面侧只加 ignore
  push:
    branches: [main]
    paths-ignore: ['mobile/**']
  pull_request:
    paths-ignore: ['mobile/**']

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go mod verify
        run: |
          set -euo pipefail
          # go mod verify 只校验“已下载到模块缓存”的依赖；zakki/core 是本地目录 replace 的
          # 第一方共享内核，永远没有 zip/ziphash，Go 1.27 起对其误报 missing ziphash
          # （上游 verify.go 未跳过目录替换模块）。这里只豁免这条已知输出，
          # 其余任何校验失败照常报错；内核与桌面副本的一致性由 make vendor-check 守护。
          known='^zakki/core v0\.0\.0-00010101[0-9]*-000000000000: missing ziphash:'
          out="$(go mod verify 2>&1)" && status=0 || status=$?
          if [ "$status" -ne 0 ]; then
            rest="$(printf '%s\n' "$out" | grep -Ev "$known" || true)"
            if [ -n "$rest" ]; then
              printf '%s\n' "$out" >&2
              exit 1
            fi
            echo 'go mod verify: 豁免本地目录替换模块 zakki/core 的已知误报'
          fi
          printf '%s\n' "$out"
          go -C core mod verify

      - name: go build（快速编译检查，不打包 .app）
        run: go build ./...

      - name: make fmt-check
        run: make fmt-check

      - name: make vet
        run: make vet

      - name: make test
        env:
          # 界面语言在 MyGo 包初始化时解析并缓存，TestMain 里再设环境变量为时已晚；
          # runner 系统语言是英文，不钉扎会让全部中文文案断言在 CI 上失真。
          MYGO_LOCALE: zh-Hans
        run: make test

      - name: make race
        env:
          MYGO_LOCALE: zh-Hans
        run: make race

      - name: make arch-check
        run: make arch-check
